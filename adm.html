<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Área administrativa da AquaMarine: cadastro de usuários.">
  <title>Adm - AquaMarine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="cabecalho">
    <a class="logo" href="principal.html">
      <i class="fa-solid fa-leaf" aria-hidden="true"></i>AquaMarine
    </a>
    <nav class="menu" aria-label="Menu principal">
      <ul>
        <li><a href="principal.html#inicio">Início</a></li>
        <li><a href="principal.html#acoes">Como ajudar</a></li>
        <li><a href="principal.html#fatos">Fatos</a></li>
        <li><a href="principal.html#ods">ODS</a></li>
        <li><a href="adm.html" aria-current="page">Adm</a></li>
        <li><a href="login.html">Sair</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="cadastro">
      <h1>Administração</h1>
      <p>Cadastre novos usuários informando o nome e o e-mail.</p>

      <form class="formulario" id="form-cadastro">
        <label for="nome">Nome do usuário</label>
        <input type="text" id="nome" name="nome" required autocomplete="off">

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required autocomplete="off">

        <div class="acoes-form">
          <button class="botao" type="submit" id="btn-cadastrar">Cadastrar</button>
          <button class="botao botao-secundario" type="button" id="btn-limpar">Limpar campos</button>
        </div>
      </form>
    </section>

    <section id="usuarios">
      <h2>Usuários cadastrados</h2>

      <div class="formulario barra-pesquisa">
        <div class="linha">
          <div>
            <label for="filtro">Pesquisar em</label>
            <select id="filtro">
              <option value="todos">Nome e e-mail</option>
              <option value="nome">Nome</option>
              <option value="email">E-mail</option>
            </select>
          </div>
          <div>
            <label for="busca">Pesquisar</label>
            <input type="search" id="busca" placeholder="Digite para pesquisar" autocomplete="off">
          </div>
        </div>
      </div>

      <div class="caixa-lista" id="caixa-lista">
        <ul class="lista-passos lista-usuarios" id="lista-usuarios"></ul>
        <p class="mensagem-vazia" id="mensagem-vazia" role="status" aria-live="polite">ERRO: o arquivo js/adm.js não foi carregado. Verifique se ele está na pasta js/ ao lado do adm.html.</p>
      </div>

      <button class="botao botao-perigo" type="button" id="btn-excluir-todos">Excluir todos</button>
    </section>
  </main>

  <footer class="rodape">
    <p>AquaMarine Projeto 2</p>
  </footer>

  <script src="js/adm.js"></script>
</body>
</html>
