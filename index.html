<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Projeto 1 web front-end">
  <title>Cadastro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="pagina-form">
  <header class="cabecalho">
    <a class="logo" href="index.html">AquaMarine</a>
  </header>

  <main>
    <section>
      <h1>Crie sua conta</h1>
      <p>Preencha seus dados para ficar atualizado/a, ou continue como um visitante!</p>

      <form class="formulario" action="login.html" method="get">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" required autocomplete="name">

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required autocomplete="email">

        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" name="telefone" autocomplete="tel">

        <label for="nascimento">Data de nascimento</label>
        <input type="date" id="nascimento" name="nascimento" required>

        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" minlength="6" required autocomplete="new-password">

        <button class="botao" type="submit">Criar conta</button>
        <p class="troca">Já tem conta? <a href="login.html">Entrar</a></p>
        <p class="troca">Entrar como convidado <a href="principal.html">Visitar</a></p>
      </form>
    </section>
  </main>

  <footer class="rodape">
    <p>AquaMarine Projeto 1</p>
  </footer>
</body>
</html>
